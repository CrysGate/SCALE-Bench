site_name: SCALE-Bench
site_description: Isaac Lab 双臂操作任务与专家数据采集
site_url: https://crysgate.github.io/SCALE-Bench/
repo_url: https://github.com/CrysGate/SCALE-Bench
repo_name: CrysGate/SCALE-Bench
copyright: SCALE-Bench · 双臂操作与专家数据采集

theme:
  name: material
  language: zh
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: 本页内容
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CrysGate/SCALE-Bench
      name: GitHub 仓库

nav:
  - 首页: index.md
  - 开始使用: getting-started.md
  - 任务指南:
      - 任务总览: tasks/index.md
      - 套娃排序: tasks/sort_dolls_by_size.md
      - 单物体抓取与放置: tasks/single_object_pick_and_place.md
      - 最大物体抓取与放置: tasks/largest_pick_and_place.md
  - 资产图鉴:
      - 资产总览: assets/index.md
      - 奶茶杯: assets/bubble_tea_cup.md
      - 场景物品: assets/scene_props.md
