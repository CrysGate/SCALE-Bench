# Dimensions and masses are simulation specifications, not measured real products.
boxes:
  - id: packing_box_small
    grasp_yaw_samples: 4
    grasp_height_fraction: 0.85
    size_object_m: [0.065, 0.065, 0.065]
    wall_thickness_m: 0.004
    bottom_thickness_m: 0.005
    mass_kg: 0.045
    friction: 0.8
    contact_offset_m: 0.001
  - id: packing_box_large
    grasp_yaw_samples: 4
    grasp_height_fraction: 0.85
    size_object_m: [0.08, 0.08, 0.08]
    wall_thickness_m: 0.004
    bottom_thickness_m: 0.005
    mass_kg: 0.065
    friction: 0.8
    contact_offset_m: 0.001
pots:
  - id: planter_pot_small
    grasp_yaw_samples: 16
    grasp_height_fraction: 0.85
    source_id: planter_pot_clay
    scale: 0.25
    mass_kg: 0.045
    friction: 0.8
    contact_offset_m: 0.001
  - id: planter_pot_large
    grasp_yaw_samples: 16
    grasp_height_fraction: 0.95
    source_id: planter_pot_clay
    scale: 0.30
    mass_kg: 0.065
    friction: 0.8
    contact_offset_m: 0.001
decomposition:
  threshold: 0.02
  seed: 0
  max_convex_hull: 64
  preprocess_resolution: 80
grasp:
  robot_config: configs/robots/piper.yml
  approach_distance_m: 0.08
  top_inset_m: 0.010
  side_pitch_rad: [0.2617993878, 0.0]
  closure_margin_m: 0.006
